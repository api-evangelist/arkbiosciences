name: Ark Biopharmaceutical
description: >-
  Ark Biopharmaceutical (爱科百发, Ark Biosciences) is a Shanghai-based clinical-stage
  biopharmaceutical company focused on the discovery and development of innovative
  therapies for respiratory diseases and pediatric conditions. Its pipeline includes
  AK0529 (ziresovir) for respiratory syncytial virus (RSV) infection, AK0901 for ADHD,
  AK3280 for idiopathic pulmonary fibrosis, AK0610 for RSV prevention, and AK0705 for
  COPD. The company is a portfolio company of Qiming Venture Partners and was added to
  the API Evangelist network as a stub for enrichment. As a drug-development company it
  publishes a corporate website, R&D pipeline, and news center, but exposes no public
  developer platform, API, or technical integration surface at this time.
